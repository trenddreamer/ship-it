# The Registry: every Enrolled repo, with the `repo:` label that routes
# Tickets to it (ADR-0002, GLOSSARY.md). The Factory refuses a Ticket with no
# `repo:` label, with more than one, or with one that isn't listed here.
#
# Each entry is a label and the repo it routes to, as `owner/name`. Enrolling
# a repo starts here, and takes a reviewed change like any other.
#
# The routing rule and its tests: .sandcastle/agent-workflows/route/route.ts.

repos:
  # The Marketplace, in a repo of its own since #53.
  - label: repo:marketplace
    repo: trenddreamer/ship-it-marketplace
