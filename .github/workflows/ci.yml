name: CI

# The gate every change to the Home repo goes through: formatting, lint,
# typecheck, and the tests of the Factory's scripts in .sandcastle/.
#
# WHY IT EXISTS
#   The pre-commit hook is kept under 3 seconds, so it checks only staged
#   files: their size, formatting and lint. Everything that grows with the
#   codebase runs here instead, on every pull request, whoever opened it.
#
# MAKE IT REQUIRED
#   Settings → Branches → a rule for `main` → "Require status checks to
#   pass" → add `check`. Until then a red run warns but doesn't block a
#   merge.
#
# LEAN CI (ADR-0003)
#   Actions minutes are shared with every Enrolled repo's CI and with the
#   factory, so this workflow runs on pull requests only. It does not run
#   again on the push to main that merging makes: that would repeat the
#   checks the pull request has just passed. A new push to a pull request
#   cancels that pull request's run if it is still going. And it is one job,
#   so no trivial check bills a whole minute of its own.

on:
  pull_request:

permissions:
  contents: read

# One run per pull request (`github.ref` is refs/pull/<n>/merge). A newer push
# makes the older run moot, so it is cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Formatting, lint, typecheck and tests
        run: npm run check
