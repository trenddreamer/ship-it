name: Agent — Implement A Spec

# ═══════════════════════════════════════════════════════════════════════════
# THE SPEC QUEUE: THE HOME REPO'S HALF
#
# Everything else runs once, on one Ticket, because a person put a label on
# it. This takes a *spec*, turns it into a queue of tickets, and then works
# the queue on its own until there is nothing left in it — and if nobody
# ever labels anything, a clock starts it anyway.
#
# There are two loops, and they are different loops. Keep them apart in your
# head while you read:
#
#   LOOP ONE — DECOMPOSE.  Runs once per spec. An agent reads the spec and the
#     Enrolled repo's code, and writes the queue: N tickets in the Home repo,
#     ordered, each with a "Done when" a reviewer can check, each carrying
#     the spec's `repo:` label. Nothing is built.
#
#   LOOP TWO — CHAIN.  Runs once per ticket. Take the frontier ticket — the
#     lowest open position whose dependencies are all merged — build it in the
#     Enrolled repo, open a draft PR there, then start this workflow again.
#     Finishing one ticket is what triggers the next. A ticket that depends on
#     an unmerged PR waits: the chain stops, and the cron picks the queue up
#     after the merge.
#
# WHERE EACH PART RUNS (ADR-0002, ADR-0003)
#
#   The spec, its tickets, their order and their state are issues and labels
#   in the Home repo. The work reads and writes an Enrolled repo's code, so it
#   runs there. This file is the Home repo's half: it surveys and claims, and
#   runs no agent and no code from any Enrolled repo.
#
#   label / cron / chain
#           │
#           ▼
#     ┌───────────┐  claim the spec or the ticket, then dispatch
#     │  survey   ├──────────────────────────────────────────────┐
#     │  (Home)   │                                              │
#     └───────────┘                                              ▼
#           ▲                                       ┌─────────────────────┐
#           │                                       │ agent-route.yml     │
#           │                                       │ (Home): route it,   │
#           │                                       │ dispatch factory.yml│
#           │                                       │ in its Enrolled repo│
#           │                                       └──────────┬──────────┘
#           │                                                  ▼
#           │            ┌───────────────────────────────────────────────┐
#           └────────────┤ factory-implement-spec.yml (Enrolled):        │
#             the chain: │ decompose → tickets in Home, or               │
#             dispatch   │ build     → draft PR in Enrolled, review      │
#             this file  └───────────────────────────────────────────────┘
#
#   `survey` runs every time and decides which loop this run is. The workflow
#   has no memory between runs; the queue on GitHub is the state. That is the
#   trick — the issues are the program counter. The rule and its tests are
#   .sandcastle/agent-workflows/implement-spec/survey.ts.
#
# THE CLAIM, AND WHY IT IS HERE
#
#   The build runs in another repo while this cron keeps ticking, so nothing
#   serialises a survey against a build any more. So the survey claims before
#   it dispatches: `agent:in-progress` on the spec (decompose), or
#   `agent:queued` off and `agent:in-progress` on the ticket (build). A
#   survey that finds a spec or ticket in progress starts nothing. Only one
#   ticket of a spec is built at a time, as before; a built ticket under
#   review holds nothing.
#
# THE CHAIN
#
#   The last step of both loops, in the Enrolled repo, dispatches this
#   workflow again in the Home repo, at its default branch, never through an
#   event in the Enrolled repo. It re-dispatches after a *failed* run too,
#   and that is deliberate: a failure parks the spec or the ticket with
#   `agent:blocked`, and `survey` skips what is parked, so the next run moves
#   on instead of rebuilding the failure. Without that this would be an
#   infinite retry, with a cron on top of it.
#
#   It stops when `survey` finds nothing to do. The chain has no counter and
#   no limit, so an empty queue, a parked ticket or a run in flight is the
#   only brake on it.
#
# ONE LIVE SPEC AT A TIME
#
#   The cron takes the newest open `agent:implement-spec` spec that isn't
#   parked, across every Enrolled repo. A second spec waits until the first
#   is drained and loses its label, or is named by dispatch.
#
# WHAT IT NEEDS
#
#   secrets.FACTORY_APP_ID,
#   secrets.FACTORY_APP_PRIVATE_KEY
#                             — the Factory App (ADR-0004). The job's first
#                               step mints a token from them, the only step
#                               that sees the key. It covers this repository
#                               only, with Issues: read/write (read the
#                               queue, refuse or claim) and Actions:
#                               read/write (dispatch agent-route.yml). The
#                               Enrolled repo's own token is minted by the
#                               routing job, not here.
#   secrets.GITHUB_TOKEN      — the sparse checkout and nothing else.
#   The `agent:implement-spec` label. A fresh clone of this repository does
#     not have it, and no workflow can create the label that starts it. Create
#     it once (the cron and the button need no label):
#       gh label create "agent:implement-spec" --color 5319E7 \
#         --description "Work this spec through the implement-spec queue"
#   The spec needs one `repo:` label the Registry (repos.yml) lists, like any
#   Ticket. Its tickets take the same one.
# ═══════════════════════════════════════════════════════════════════════════

on:
  # 1. A person opens the queue by labelling the spec.
  issues:
    types: [labeled]

  # 2. The clock. Every fifteen minutes it looks at the queue and moves it on
  #    one ticket, whether or not anyone asked. This is the trigger that makes
  #    the factory a thing that runs rather than a thing you run: the queue
  #    drains overnight and you read pull requests in the morning. It is also
  #    what picks the queue up after a merge, when the chain has stopped.
  #
  #    Two honest caveats, because they will bite you on the day:
  #      • GitHub schedules are best-effort. A `*/15` cron on a busy hour can
  #        land several minutes late, and the top of the hour is the worst slot
  #        there is. Do not count on a run starting exactly at :00.
  #      • GitHub disables scheduled workflows in a repository with no commits
  #        for sixty days, and emails the owner. A quiet repo stops on its own.
  schedule:
    - cron: "*/15 * * * *"

  # 3. The button, and the chain. `workflow_dispatch` is how a human starts it
  #    without labelling anything — and it is how the last step of each loop,
  #    in the Enrolled repo, starts the next ticket. One trigger, two callers.
  workflow_dispatch:
    inputs:
      spec_issue:
        description: "The spec issue number to work. Leave blank to pick up whichever spec is labelled agent:implement-spec."
        required: false
        type: string

# A ceiling on the GITHUB_TOKEN, which only checks out the Registry and the
# scripts. Everything else goes through the Factory App's token.
permissions:
  contents: read # the sparse checkout

# One survey at a time, repo-wide, and never cancelled: two at once would both
# pick the same frontier ticket and claim it twice. `cancel-in-progress:
# false` matters just as much — a cron tick must not kill a survey that is
# halfway through a claim.
#
# Only the runs that can do something join that group. Every label on every
# issue starts this workflow, and the factory's own labels do too (`agent:in-
# progress` when it claims, `agent:blocked` when it parks). A group holds one
# running run and one waiting run, and a newcomer replaces the one waiting —
# so those label runs, left in the group, could bump the chain's next run out
# of the queue. Every other label gets a throwaway group of its own, and is
# skipped for free.
concurrency:
  group: ${{ (github.event_name != 'issues' || github.event.label.name == 'agent:implement-spec') && 'agent-implement-spec' || format('ignore-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # ── survey ────────────────────────────────────────────────────────────────
  # Routes the spec, reads the queue, decides what this run is, claims it and
  # hands it to the routing job. No agent, and a checkout of four paths, so it
  # is cheap enough to run every fifteen minutes forever.
  survey:
    # Label runs are filtered here; cron and dispatch runs carry no label and
    # fall through.
    if: >-
      github.event_name != 'issues' ||
      github.event.label.name == 'agent:implement-spec'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      # 'decompose' | 'implement' | 'busy' | 'drained' | 'no-spec' | 'refused'.
      mode: ${{ steps.survey.outputs.mode || steps.spec.outputs.mode || 'refused' }}
      spec: ${{ steps.spec.outputs.spec }}
      ticket: ${{ steps.survey.outputs.ticket }}

    env:
      GH_REPO: ${{ github.repository }}
      # Whichever of the three triggers fired, the spec number ends up here.
      REQUESTED_SPEC: ${{ github.event.issue.number || inputs.spec_issue }}

    steps:
      - name: Mint the Factory App's token
        # This repository only. Issues to read the queue, refuse a spec and
        # claim; Actions to dispatch the routing job.
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-actions: write

      - name: Find the spec
        id: spec
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail

          # Which spec are we working? The trigger may have named one. A cron
          # tick did not, so take the newest open spec that isn't parked.
          spec="${REQUESTED_SPEC:-}"
          if [ -z "$spec" ]; then
            spec=$(gh issue list --state open --label "agent:implement-spec" --limit 100 \
              --json number,labels \
              --jq '[.[] | select(any(.labels[]; .name == "agent:blocked") | not)] | .[0].number // empty')
          fi
          if [ -z "$spec" ]; then
            echo "No spec is labelled agent:implement-spec. Nothing to do."
            echo "mode=no-spec" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$spec" =~ ^[0-9]+$ ]]; then
            echo "::error::The spec_issue input must be a number."
            exit 1
          fi
          echo "spec=$spec" >> "$GITHUB_OUTPUT"
          echo "Working spec #$spec"

      - name: Checkout the Registry and the scripts
        if: steps.spec.outputs.spec != ''
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            repos.yml
            .github/actions
            .sandcastle/agent-workflows/route
            .sandcastle/agent-workflows/implement-spec

      - name: Route the spec
        # Through the Registry, repos.yml (ADR-0002). A refused spec gets one
        # comment with the reason, loses `agent:implement-spec` (so the next
        # cron tick doesn't find it and refuse it again), and is marked
        # `agent:blocked`. Nothing else runs. The routing job routes the spec
        # or ticket again before it dispatches anything.
        id: route
        if: steps.spec.outputs.spec != ''
        uses: ./.github/actions/route-tickets
        with:
          tickets: "[${{ steps.spec.outputs.spec }}]"
          trigger: agent:implement-spec
          token: ${{ steps.app.outputs.token }}

      - name: Survey the queue
        # Plain `node` runs the .ts file: the route action's setup-node put
        # Node 22 on the PATH. Every ticket decompose writes is labelled
        # `spec:<number>`; no such issues, open or closed, means the spec has
        # never been decomposed.
        id: survey
        if: steps.route.outputs.routed != '' && steps.route.outputs.routed != '[]'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SPEC: ${{ steps.spec.outputs.spec }}
        run: |
          set -euo pipefail
          gh issue view "$SPEC" --json labels > /tmp/spec.json
          gh issue list --state all --label "spec:${SPEC}" --limit 100 \
            --json number,state,labels,body > /tmp/queue.json
          node .sandcastle/agent-workflows/implement-spec/survey-queue.ts /tmp/spec.json \
            < /tmp/queue.json > /tmp/survey.json
          jq . /tmp/survey.json

          jq -r '.notices[]' /tmp/survey.json | while read -r notice; do
            echo "::notice::Spec #${SPEC}: ${notice}"
          done
          mode="$(jq -r .mode /tmp/survey.json)"
          if [ "$mode" = "busy" ] || [ "$mode" = "drained" ]; then
            echo "Spec #${SPEC}: $(jq -r .reason /tmp/survey.json)"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "ticket=$(jq -r '.ticket // empty' /tmp/survey.json)" >> "$GITHUB_OUTPUT"

      - name: Claim, then hand to the routing job
        # The claim comes first (see THE CLAIM above). agent-route.yml routes
        # the spec or ticket, and dispatches factory.yml in its Enrolled repo
        # with `task=decompose` or `task=build`.
        if: steps.survey.outputs.mode == 'decompose' || steps.survey.outputs.mode == 'implement'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SPEC: ${{ steps.spec.outputs.spec }}
          MODE: ${{ steps.survey.outputs.mode }}
          TICKET: ${{ steps.survey.outputs.ticket }}
        run: |
          set -euo pipefail
          gh label create "agent:in-progress" --color FBCA04 \
            --description "An agent is working on this right now" || true
          ref="$(gh api "repos/$GH_REPO" --jq .default_branch)"

          if [ "$MODE" = "decompose" ]; then
            claimed="$SPEC"
            gh issue edit "$SPEC" --add-label "agent:in-progress"
            dispatch=(-f task=decompose -f ticket="$SPEC" -f spec="$SPEC")
          else
            claimed="$TICKET"
            gh issue edit "$TICKET" --remove-label "agent:queued" || true
            gh issue edit "$TICKET" --add-label "agent:in-progress"
            dispatch=(-f task=build -f ticket="$TICKET" -f spec="$SPEC")
          fi

          # Claimed but never handed on: nothing else would ever free it.
          if ! gh workflow run agent-route.yml --ref "$ref" "${dispatch[@]}"; then
            gh issue edit "$claimed" --remove-label "agent:in-progress" || true
            echo "::error::Could not dispatch agent-route.yml for #${claimed}."
            exit 1
          fi
          echo "Spec #${SPEC}: #${claimed} claimed and handed to the routing job (${MODE})."
