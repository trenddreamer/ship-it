name: Factory

# The Marketplace's caller workflow (ADR-0003). Every Enrolled repo has one
# like it: a few lines that call the shared Factory workflows in the Home
# repo at `main`, with the repo's Contract as their inputs. The Factory's
# logic lives there, not here.
#
# The Marketplace is still in ship-it, so this file sits in the Home repo, but
# it calls the shared workflows by their full `trenddreamer/ship-it/...@main`
# path, the way any other Enrolled repo does, so the run takes the cross-repo
# path. It moves to the Marketplace's own repo with the Marketplace.
#
# WHAT STARTS IT
#   Only the Home repo's routing job, .github/workflows/agent-route.yml, with
#   `workflow_dispatch`: a task and the Tickets it is for. Nothing in this
#   repo starts the Factory.
#
# THE CONTRACT
#   install   how to install the repo, from a fresh checkout.
#   seed      how to set up and seed its database.
#   check     the checks a change must pass.
#
# SECRETS
#   Passed one by one, never inherited, so a shared workflow gets exactly
#   these and none of the repo's others:
#   CLAUDE_CODE_OAUTH_TOKEN, FACTORY_APP_ID, FACTORY_APP_PRIVATE_KEY.

on:
  workflow_dispatch:
    inputs:
      task:
        description: The Factory's task.
        type: choice
        options: [explore]
        required: true
      tickets:
        description: The Tickets in the Home repo, as a JSON array, e.g. `[12, 13]`.
        type: string
        required: true

# The built-in token gets nothing unless a job asks for it.
permissions: {}

jobs:
  explore:
    if: inputs.task == 'explore'
    uses: trenddreamer/ship-it/.github/workflows/factory-explore.yml@main
    permissions:
      contents: read
    with:
      tickets: ${{ inputs.tickets }}
      install: npm ci
      seed: npm run db:migrate && npm run db:seed
      check: npm run check
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      FACTORY_APP_ID: ${{ secrets.FACTORY_APP_ID }}
      FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
