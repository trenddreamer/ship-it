name: Factory

# The Marketplace's caller workflow (ADR-0003). Every Enrolled repo has one
# like it: a few lines that call the shared Factory workflows in the Home
# repo at `main`, with the repo's Contract as their inputs. The Factory's
# logic lives there, not here.
#
# The Marketplace is still in ship-it, so this file sits in the Home repo, but
# it calls the shared workflows by their full `trenddreamer/ship-it/...@main`
# path, the way any other Enrolled repo does, so the run takes the cross-repo
# path. It moves to the Marketplace's own repo with the Marketplace.
#
# WHAT STARTS IT
#   Only the Home repo's routing job, .github/workflows/agent-route.yml, with
#   `workflow_dispatch`: a task and the Tickets it is for. Nothing in this
#   repo starts the Factory.
#
#     explore     `tickets`, a batch of Tickets routed to this repo.
#     implement   `ticket`, the one Ticket to build.
#     review      `ticket`, and `pr`, the pull request here to review. With
#                 no `pr`, review finds the Ticket's open pull request.
#     decompose   `spec`, a spec to cut into a queue of tickets, written into
#                 the Home repo.
#     build       `spec`, and `ticket`, the queue's frontier ticket to build.
#
# THE CONTRACT
#   install   how to install the repo, from a fresh checkout.
#   seed      how to set up and seed its database.
#   check     the checks a change must pass.
#
# SECRETS
#   Passed one by one, never inherited, so a shared workflow gets exactly
#   these and none of the repo's others:
#   CLAUDE_CODE_OAUTH_TOKEN, FACTORY_APP_ID, FACTORY_APP_PRIVATE_KEY.

on:
  workflow_dispatch:
    inputs:
      task:
        description: The Factory's task.
        type: choice
        options: [explore, implement, review, decompose, build]
        required: true
      tickets:
        description: For explore, the Tickets in the Home repo, as a JSON array, e.g. `[12, 13]`.
        type: string
        required: false
      ticket:
        description: For implement, review and build, the Ticket's number in the Home repo.
        type: string
        required: false
      pr:
        description: For review, the pull request's number in this repo. Empty to find it from the Ticket.
        type: string
        required: false
      spec:
        description: For decompose and build, the spec's number in the Home repo.
        type: string
        required: false

# The built-in token gets nothing unless a job asks for it.
permissions: {}

jobs:
  explore:
    if: inputs.task == 'explore'
    uses: trenddreamer/ship-it/.github/workflows/factory-explore.yml@main
    permissions:
      contents: read
    with:
      tickets: ${{ inputs.tickets }}
      install: npm ci
      seed: npm run db:migrate && npm run db:seed
      check: npm run check
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      FACTORY_APP_ID: ${{ secrets.FACTORY_APP_ID }}
      FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}

  implement:
    if: inputs.task == 'implement'
    uses: trenddreamer/ship-it/.github/workflows/factory-implement.yml@main
    permissions:
      contents: read
    with:
      ticket: ${{ inputs.ticket }}
      install: npm ci
      seed: npm run db:migrate && npm run db:seed
      check: npm run check
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      FACTORY_APP_ID: ${{ secrets.FACTORY_APP_ID }}
      FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}

  review:
    if: inputs.task == 'review'
    uses: trenddreamer/ship-it/.github/workflows/factory-review.yml@main
    permissions:
      contents: read
    with:
      ticket: ${{ inputs.ticket }}
      pr: ${{ inputs.pr }}
      install: npm ci
      seed: npm run db:migrate && npm run db:seed
      check: npm run check
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      FACTORY_APP_ID: ${{ secrets.FACTORY_APP_ID }}
      FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}

  implement-spec:
    if: inputs.task == 'decompose' || inputs.task == 'build'
    uses: trenddreamer/ship-it/.github/workflows/factory-implement-spec.yml@main
    permissions:
      contents: read
    with:
      task: ${{ inputs.task }}
      spec: ${{ inputs.spec }}
      ticket: ${{ inputs.ticket }}
      install: npm ci
      seed: npm run db:migrate && npm run db:seed
      check: npm run check
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      FACTORY_APP_ID: ${{ secrets.FACTORY_APP_ID }}
      FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
