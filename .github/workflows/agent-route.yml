name: Agent — Route The Tickets

# The routing job: the Home repo's half of every Factory run (ADR-0002,
# ADR-0003). The Home repo holds the Tickets and routes them; the work runs
# inside the Enrolled repo each Ticket is for. This workflow routes, claims
# and dispatches, and runs no agent and no code from any Enrolled repo.
#
# EXPLORE
#   Someone puts `agent:explore` on a Ticket. The run then ignores which
#   Ticket that was, and takes every open `agent:explore` Ticket:
#
#     route      each Ticket through the Registry, repos.yml. One with no
#                `repo:` label, more than one, or one the Registry doesn't
#                list is refused: one comment with the reason, `agent:explore`
#                off, `agent:blocked` on. See .github/actions/route-tickets.
#     batch      the rest, grouped by Enrolled repo, so a batch only ever
#                holds Tickets for one repo. See
#                .sandcastle/agent-workflows/route/batch.ts.
#     dispatch   one job per batch: claim its Tickets (`agent:explore` off,
#                `agent:in-progress` on), then start the Enrolled repo's
#                caller workflow, factory.yml, with `task=explore` and the
#                batch. The claim comes first, so a run that starts before
#                that one does never takes the same Tickets.
#
#   Batches for different Enrolled repos are dispatched side by side, and
#   their runs never wait on each other.
#
# IMPLEMENT
#   Someone puts `agent:implement` on a Ticket: the Owner, or explore's apply
#   job when it called the Ticket an easy call. The same jobs run, on that
#   one Ticket, if it is still open and still labelled when the run starts:
#   route it, claim it (`agent:implement` off, `agent:in-progress` on), and
#   start factory.yml in its Enrolled repo with `task=implement` and
#   `ticket=<n>`. Implement never starts any other way: no event in an
#   Enrolled repo starts it.
#
#   #47 and #48 add review and the spec queue here the same way.
#
# TOKENS
#   Two Factory App tokens (ADR-0004), each minted in its job's first step,
#   the only step that sees the private key:
#     route      covers the Home repo only (the default with no `owner` or
#                `repositories`), with Issues: read/write. It reads, refuses
#                and nothing else.
#     dispatch   covers the Home repo and that batch's Enrolled repo, and
#                nothing else, with Issues: read/write to claim the Tickets
#                and Actions: read/write to dispatch the run. It is minted
#                per batch, after routing, because the repo it covers is the
#                one the Registry named.
#   A run the App's token dispatches starts; GitHub only holds back runs the
#   built-in GITHUB_TOKEN would start.
#
# WHAT IT NEEDS
#   secrets.FACTORY_APP_ID, secrets.FACTORY_APP_PRIVATE_KEY — the Factory App.
#   The Factory App installed on every repo in the Registry, and each one's
#     caller workflow, factory.yml, on its default branch.
#   The `agent:explore` and `agent:implement` labels. A fresh clone of this
#     repository does not have them, and no workflow can create the label
#     that starts it. Create them once:
#       gh label create "agent:explore" --color 5319E7 \
#         --description "The factory explores this ticket"
#       gh label create "agent:implement" --color 5319E7 \
#         --description "Hand this issue to the implementer agent"

on:
  issues:
    types: [labeled]

# One explore routing run at a time, and one implement routing run per
# Ticket, never cancelled. A label that lands mid-run queues one more run
# behind this one, which lists the Tickets again when it starts. The Tickets
# this run took are `agent:in-progress` by then, so nothing is taken twice
# and nothing is lost. GitHub keeps one queued run per group, and bumps an
# older one for a newer; a bumped run has claimed nothing, so that loses
# nothing either. Every other label gets a throwaway group of its own, so it
# can never bump a queued run.
#
# These groups, with the trigger label coming off at the claim, are what
# stop a runaway chain: a Ticket is built again only when the label goes
# back on.
concurrency:
  group: >-
    ${{ github.event.label.name == 'agent:explore' && 'agent-route-explore'
    || github.event.label.name == 'agent:implement' && format('agent-route-implement-{0}', github.event.issue.number)
    || format('ignore-{0}', github.run_id) }}
  cancel-in-progress: false

permissions: {}

jobs:
  route:
    if: github.event.label.name == 'agent:explore' || github.event.label.name == 'agent:implement'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read # the sparse checkout. The Tickets are read with the App's token.

    outputs:
      batches: ${{ steps.batch.outputs.batches || '[]' }}

    env:
      GH_REPO: ${{ github.repository }}
      TRIGGER: ${{ github.event.label.name }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}

    steps:
      - name: Mint the Factory App's token
        # The Home repo only, Issues: read/write: enough to read the Tickets
        # and refuse the ones the Registry can't route.
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-issues: write

      - name: Checkout the Registry and the routing code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            repos.yml
            .github/actions
            .sandcastle/agent-workflows/route

      - name: List the open Tickets
        id: open
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          if [ "$TRIGGER" = "agent:explore" ]; then
            # Explore takes every open `agent:explore` Ticket, not just the
            # one that was labelled. Labels often go on several at once. Let
            # them all land.
            sleep 5
            numbers="$(gh issue list --state open --label "agent:explore" --limit 100 \
              --json number --jq '[.[].number] | sort')"
          else
            # Implement takes the Ticket that was labelled, if it is still
            # open and still has the label: a run queued behind another may
            # find it closed, or the label taken off again.
            numbers="$(gh issue view "$ISSUE_NUMBER" --json number,state,labels --jq \
              'if .state == "OPEN" and any(.labels[]; .name == "agent:implement")
               then [.number] else [] end')"
          fi
          echo "numbers=$numbers" >> "$GITHUB_OUTPUT"

      - name: Route the Tickets
        # Leaves each Ticket's route in $RUNNER_TEMP/route/routes.json. It
        # sets up Node 22 itself, which the next step uses too.
        id: route
        if: steps.open.outputs.numbers != '[]'
        uses: ./.github/actions/route-tickets
        with:
          tickets: ${{ steps.open.outputs.numbers }}
          trigger: ${{ github.event.label.name }}
          token: ${{ steps.app.outputs.token }}

      - name: Batch the Tickets by Enrolled repo
        # Implement's one Ticket makes one batch of one.
        id: batch
        if: steps.route.outputs.routed != '' && steps.route.outputs.routed != '[]'
        # Plain `node` runs the .ts file: the route action's setup-node put
        # Node 22 on the PATH, current enough (22.18+) to strip types by
        # default, so the script needs no `npm ci`.
        run: |
          set -euo pipefail
          node .sandcastle/agent-workflows/route/batch-tickets.ts "$GH_REPO" \
            < "$RUNNER_TEMP/route/routes.json" > "$RUNNER_TEMP/route/batches.json"
          jq -c '.[]' "$RUNNER_TEMP/route/batches.json"
          echo "batches=$(jq -c . "$RUNNER_TEMP/route/batches.json")" >> "$GITHUB_OUTPUT"

  dispatch:
    needs: route
    if: needs.route.outputs.batches != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # No checkout, so the GITHUB_TOKEN gets nothing.
    permissions: {}

    strategy:
      # One Enrolled repo's trouble doesn't hold up the others' batches.
      fail-fast: false
      matrix:
        batch: ${{ fromJSON(needs.route.outputs.batches) }}

    env:
      GH_REPO: ${{ github.repository }}
      ENROLLED_REPO: ${{ matrix.batch.repo }}
      TICKETS: ${{ toJSON(matrix.batch.tickets) }}
      TRIGGER: ${{ github.event.label.name }}
      # `agent:explore` → explore, `agent:implement` → implement.
      TASK: ${{ github.event.label.name == 'agent:explore' && 'explore' || 'implement' }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Mint the Factory App's token
        # The Home repo and this batch's Enrolled repo, and nothing else.
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ matrix.batch.owner }}
          repositories: ${{ matrix.batch.repositories }}
          permission-issues: write
          permission-actions: write

      - name: Claim the Tickets
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          # A fresh clone of this repository does not have these labels yet.
          gh label create "agent:in-progress" --color FBCA04 \
            --description "An agent is working on this right now" || true
          gh label create "agent:blocked" --color B60205 \
            --description "An agent run failed here. Its comment says how to retry" || true
          # The trigger comes off, so putting it back on is how you retry.
          # `agent:in-progress` stays on until the run moves it on.
          for n in $(jq -r '.[]' <<< "$TICKETS"); do
            gh issue edit "$n" --remove-label "$TRIGGER" || true
            gh issue edit "$n" --remove-label "agent:blocked" || true
            gh issue edit "$n" --add-label "agent:in-progress"
          done

      - name: Start the run in the Enrolled repo
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          # workflow_dispatch runs the caller from the repo's default branch.
          ref="$(gh api "repos/$ENROLLED_REPO" --jq .default_branch)"
          case "$TASK" in
            explore) gh workflow run factory.yml -R "$ENROLLED_REPO" --ref "$ref" \
                       -f task=explore -f tickets="$TICKETS" ;;
            # A batch of one: implement builds a Ticket at a time.
            implement) gh workflow run factory.yml -R "$ENROLLED_REPO" --ref "$ref" \
                         -f task=implement -f ticket="$(jq -r '.[0]' <<< "$TICKETS")" ;;
          esac
          echo "The $TASK run for $TICKETS started in $ENROLLED_REPO."

      - name: Mark blocked on failure
        # Claimed but never started: nothing else will move them on.
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          for n in $(jq -r '.[]' <<< "$TICKETS"); do
            gh issue edit "$n" --remove-label "agent:in-progress" || true
            gh issue edit "$n" --add-label "agent:blocked" || true
            gh issue comment "$n" --body \
              "The ${TASK} run could not be started in \`${ENROLLED_REPO}\` — [logs](${RUN_URL}). Re-add \`${TRIGGER}\` to retry. <!-- factory:status -->"
          done
