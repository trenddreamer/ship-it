name: Factory — Explore The Tickets

# The third workflow in the software factory, and the one that runs first.
# A shared workflow: it lives in the Home repo and runs inside an Enrolled
# repo (ADR-0003).
#
# WHAT STARTS IT
#   Nothing starts it on its own. An Enrolled repo's caller workflow calls it
#   (for the Marketplace, still in ship-it: .github/workflows/factory.yml),
#   and the Home repo's routing job, .github/workflows/agent-route.yml,
#   dispatches that caller with `task=explore` and a batch of Tickets.
#
#   The routing job has already done the rest before this starts: routed
#   every open `agent:explore` Ticket through the Registry, refused the
#   ones it can't route, grouped the rest by Enrolled repo, and claimed each
#   batch (`agent:explore` off, `agent:in-progress` on). So a batch only ever
#   holds Tickets for this repo, and this workflow explores exactly the
#   Tickets it was given.
#
# WHICH REPO IS WHICH
#   It runs in the Enrolled repo, so `github.repository` is the Enrolled
#   repo: the code it checks out and the run page the Ticket links to. The
#   Tickets live in the Home repo, HOME_REPO below, and every `gh` call
#   about them says so with `-R` or `repos/$HOME_REPO`. The agent scripts
#   come from the Home repo's `main` too, cloned outside the workspace.
#
# WHY A BATCH
#   Tickets arrive in clumps, and a clump has duplicates in it: the same bug
#   reported twice, three symptoms of one root cause. One run per ticket reads
#   the same code three times and never notices. One run over the batch reads
#   every ticket first, groups the ones that look related, explores each group
#   once with a subagent, and closes the duplicates onto the oldest ticket.
#
# WHAT IT DOES — AND, MORE IMPORTANTLY, WHAT IT DOES NOT
#   It reads. It reads the tickets and the code they would touch, and it hands
#   back a plan: one entry per ticket, with the comment to post on it. It does
#   not edit a file, open a branch or open a pull request.
#
#   It does not even post its own comments. There are two jobs:
#
#     explore   runs the agent. The agent holds no GitHub token at all.
#     apply     runs no agent. It checks the plan, and only then writes.
#
#   Read where the Factory App's token goes before you read anything else. It
#   is the enforcement, not the description. The prompt asks the agent to
#   stay read-only. In the explore job the token goes to the steps that
#   clone the agent scripts and read the batch. They run before the agent
#   exists, and run nothing but `git`, `gh` and `jq`. The token can read
#   code and touch issues, and nothing else.
#   The job's own GITHUB_TOKEN can read the code and nothing else. So the
#   agent has nothing to write with.
#
# WHY EXPLORE BEFORE YOU COMMIT
#   A ticket that looks like twenty minutes and is actually a schema change
#   costs the same to explore as one that really is twenty minutes. The cheap
#   run in front tells you which one you have, and it tells you in prose a
#   human can read in thirty seconds instead of a diff they have to review.
#
# AND THEN IT BRANCHES ON ITS OWN ANSWER
#   Every entry in the plan carries a `tag`, a closed enum in
#   .sandcastle/agent-workflows/explore/plan-schema.ts, and the apply job
#   branches on it:
#
#     easy-call       →  swap `agent:in-progress` for `agent:implement`,
#                        which is the trigger for agent-implement.yml. The
#                        factory keeps going without being asked.
#     anything else   →  swap it for `needs-a-human` and stop. Somebody has
#                        to come and look.
#     a duplicate     →  closed, whatever its tag.
#
#   That is a real if/else in the apply job, on a value the agent chose. Not a
#   sentence in a prompt asking it to be careful. And a plan with a tag the
#   workflow does not recognise is refused whole: nothing is written, the run
#   goes red, and every issue in the batch is marked `agent:blocked`.
#
# THE LABELS WHILE IT RUNS
#   The routing job claimed the batch: each Ticket is `agent:in-progress`.
#   Apply swaps that for the Ticket's next label. If the run fails, the
#   apply job's last steps mark every Ticket still in progress
#   `agent:blocked`; re-add `agent:explore` to retry. They run even when the
#   explore job failed, which is why apply waits on explore with `always()`
#   and skips its plan steps unless explore succeeded.
#
# THE AGENT
#   A Sandcastle script: .sandcastle/agent-workflows/explore/explore.ts, with
#   its prompt next to it in prompt.md. It runs from the Home repo's clone,
#   with the Enrolled repo's checkout as its working directory, so the agent
#   explores the Enrolled repo's code.
#
# WHAT IT NEEDS (passed by the caller, never inherited)
#   inputs.tickets — the batch, a JSON array of Ticket numbers in the Home
#     repo, e.g. `[12, 13]`.
#   inputs.install, inputs.seed, inputs.check — the Enrolled repo's Contract.
#     Explore runs `install`, so the agent can run the code. It reads, so it
#     neither seeds nor checks; it takes all three so every shared workflow
#     takes the same Contract.
#   secrets.CLAUDE_CODE_OAUTH_TOKEN — the agent's auth token.
#   secrets.FACTORY_APP_ID, secrets.FACTORY_APP_PRIVATE_KEY — the Factory
#     App (ADR-0004). Each job's first step mints a token from them with
#     actions/create-github-app-token, and only that step sees the key. The
#     token is new for each job, covers the Home repo and this Enrolled repo
#     and nothing else, carries only the permissions that job needs, and is
#     revoked when the job ends. So the findings and labels show as the
#     Factory's bot, `<slug>[bot]`, not as the Owner.
#     A label applied with the built-in GITHUB_TOKEN does NOT start another
#     workflow. The chain from explore to implement needs `agent:implement`
#     to start one, so it goes on with the App's token, which does.
#   secrets.GITHUB_TOKEN — supplied by Actions, and used only to check the
#     Enrolled repo's code out. The caller's job sets its permissions.

on:
  workflow_call:
    inputs:
      tickets:
        description: The batch, a JSON array of Ticket numbers in the Home repo.
        type: string
        required: true
      install:
        description: The Contract's install command, run at the Enrolled repo's root.
        type: string
        required: true
      seed:
        description: The Contract's seed command. Explore doesn't seed.
        type: string
        required: true
      check:
        description: The Contract's check command. Explore doesn't check.
        type: string
        required: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      FACTORY_APP_ID:
        required: true
      FACTORY_APP_PRIVATE_KEY:
        required: true

# No concurrency group. Each batch was claimed before it was dispatched, so
# two explore runs never share a Ticket, and both only read. A group would
# also be a trap: GitHub keeps one pending run per group and cancels the
# others, and a cancelled run would leave its batch `agent:in-progress`.

env:
  # Where the Tickets live, and where the agent scripts come from.
  HOME_REPO: trenddreamer/ship-it

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read # the Enrolled checkout. The Tickets are read with the App's token.

    # The batch it was given, and the plan it came back with. The apply job
    # reads both.
    outputs:
      batch: ${{ steps.batch.outputs.numbers }}
      plan: ${{ steps.plan.outputs.json }}

    steps:
      - name: Mint the Factory App's token
        # First, before anything else runs, and the only step that sees the
        # private key. The token covers the Home repo and this Enrolled repo
        # (once, while they are the same repo), with Issues: read/write for
        # the Tickets and Contents: read for the agent scripts.
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: trenddreamer
          repositories: ${{ github.event.repository.name == 'ship-it' && 'ship-it' || format('ship-it,{0}', github.event.repository.name) }}
          permission-issues: write
          permission-contents: read

      - name: Check out the Enrolled repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Clone the agent scripts from the Home repo
        # Into $RUNNER_TEMP/factory, outside the workspace, so the agent's
        # `git status` in the Enrolled repo never sees them. actions/checkout
        # can't write outside the workspace, so this is a plain clone. The
        # token goes in a one-off header, never into .git/config.
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            clone --depth 1 --branch main --filter=blob:none --sparse \
            "https://github.com/${HOME_REPO}.git" "$RUNNER_TEMP/factory"
          # The root files (package.json, the lockfile) come with the cone.
          git -C "$RUNNER_TEMP/factory" \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            sparse-checkout set .sandcastle

      - name: Read the batch
        id: batch
        env:
          # The token, before the agent exists. Nothing after this gets it.
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TICKETS: ${{ inputs.tickets }}
        run: |
          set -euo pipefail
          # Titles and bodies are written by whoever opened the issue, so they
          # go straight into a file. They never pass through the shell or an
          # Actions expression. The agent reads the file. The comments come
          # from the REST API, which says which are a bot's, and are filtered
          # once Node is installed (see "Keep the comments that may steer").
          # A Ticket closed since it was claimed is left out.
          mkdir -p /tmp/explore/comments
          for n in $(jq -r '.[]' <<< "$TICKETS"); do
            gh issue view "$n" -R "$HOME_REPO" --json number,title,body,createdAt,state
          done | jq -s 'map(select(.state == "OPEN") | del(.state)) | sort_by(.number)' \
            > /tmp/explore/batch.json

          numbers="$(jq -c '[.[].number] | sort' /tmp/explore/batch.json)"
          for n in $(jq -r '.[]' <<< "$numbers"); do
            gh api --paginate "repos/$HOME_REPO/issues/$n/comments" --jq '.[]' \
              | jq -s . > "/tmp/explore/comments/$n.json"
          done
          echo "Batch: $numbers"
          echo "numbers=$numbers" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 22
        # Before anything runs Node or npm. No npm cache: setup-node only
        # hashes lockfiles inside the workspace, and the agent scripts' one
        # is in the Home repo's clone, outside it. The Enrolled repo's own
        # install is its Contract's business.
        if: steps.batch.outputs.numbers != '[]'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the agent scripts' dependencies
        # Sandcastle, zod and tsx, from the Home repo's lockfile. HUSKY=0: no
        # git hooks in a clone nobody commits to.
        if: steps.batch.outputs.numbers != '[]'
        working-directory: ${{ runner.temp }}/factory
        env:
          HUSKY: "0"
        run: npm ci

      - name: Install the Enrolled repo (the Contract's install)
        # Through env, never pasted into the script: the Contract is text.
        if: steps.batch.outputs.numbers != '[]'
        env:
          INSTALL: ${{ inputs.install }}
        run: bash -euo pipefail -c "$INSTALL"

      - name: Install Claude Code
        if: steps.batch.outputs.numbers != '[]'
        run: npm install -g @anthropic-ai/claude-code

      - name: Install Matt Pocock's skills
        if: steps.batch.outputs.numbers != '[]'
        # Not pinned on purpose: CI follows the latest plugin, like a local install.
        run: |
          claude plugin marketplace add anthropics/claude-plugins-official
          claude plugin install mattpocock-skills@claude-plugins-official

      - name: Cache agent-browser's Chrome
        if: steps.batch.outputs.numbers != '[]'
        uses: actions/cache@v4
        with:
          path: ~/.agent-browser/browsers
          key: agent-browser-0.27.0-${{ runner.os }}

      - name: Install agent-browser
        # The agent drives the app with it for screenshots and checks. Without
        # it here, each run installs it mid-session.
        if: steps.batch.outputs.numbers != '[]'
        run: |
          npm install -g agent-browser@0.27.0
          agent-browser install

      - name: Keep the comments that may steer the agent
        # A comment goes in only when its author has write access to the Home
        # repo, or it is the Factory's own bot, and it is not one of the
        # Factory's status lines. Every other bot, the Feedback App's above
        # all, is left out. The rule and its tests are in
        # .sandcastle/agent-workflows/shared/steering-comments.ts, run from
        # the Home repo's clone.
        if: steps.batch.outputs.numbers != '[]'
        env:
          FACTORY_BOT: ${{ steps.app.outputs.app-slug }}[bot]
        run: |
          set -euo pipefail
          factory="$RUNNER_TEMP/factory"
          echo '{}' > /tmp/explore/kept.json
          for f in /tmp/explore/comments/*.json; do
            n="$(basename "$f" .json)"
            "$factory/node_modules/.bin/tsx" \
              "$factory/.sandcastle/agent-workflows/shared/keep-steering-comments.ts" "$FACTORY_BOT" \
              < "$f" > /tmp/explore/kept-one.json
            jq --arg n "$n" --slurpfile c /tmp/explore/kept-one.json '.[$n] = $c[0]' \
              /tmp/explore/kept.json > /tmp/explore/kept-next.json
            mv /tmp/explore/kept-next.json /tmp/explore/kept.json
          done
          jq --slurpfile kept /tmp/explore/kept.json \
            'map(.comments = $kept[0][.number | tostring])' \
            /tmp/explore/batch.json > /tmp/explore/issues.json
          # The agent reads issues.json and nothing else in here.
          rm -r /tmp/explore/comments /tmp/explore/kept.json /tmp/explore/kept-one.json \
            /tmp/explore/batch.json

      - name: Explore
        if: steps.batch.outputs.numbers != '[]'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OUTPUT_DIR: ${{ runner.temp }}
        # The script and its prompt come from the Home repo's clone; the
        # working directory is the Enrolled checkout, which is what the agent
        # explores. The plan comes back as plan.json, shaped and validated by
        # .sandcastle/agent-workflows/explore/plan-schema.ts.
        run: |
          "$RUNNER_TEMP/factory/node_modules/.bin/tsx" \
            "$RUNNER_TEMP/factory/.sandcastle/agent-workflows/explore/explore.ts"

      - name: Hand the plan to the apply job
        id: plan
        if: steps.batch.outputs.numbers != '[]'
        run: |
          set -euo pipefail
          echo "json=$(jq -c . "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"

      - name: Hand the screenshots to the apply job
        if: steps.batch.outputs.numbers != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: explore-evidence
          path: /tmp/evidence/*.png
          if-no-files-found: ignore

  # Also the run's end: the same two label steps that close every other agent
  # workflow, over the whole batch. They live here, not in a job of their own,
  # so a few seconds of `gh` don't bill a whole minute of their own.
  apply:
    needs: explore
    # Runs even when explore failed before it read the batch (an empty
    # output), so the claimed Tickets are still marked blocked.
    if: always() && inputs.tickets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # No checkout and no agent, so the GITHUB_TOKEN gets nothing. This job
    # writes with a Factory App token of its own, and it is the only job that
    # can. The explore job's token was revoked when that job ended.
    permissions: {}

    env:
      # The batch as claimed, so a failure before explore read it still marks
      # every claimed Ticket.
      BATCH: ${{ needs.explore.outputs.batch || inputs.tickets }}
      # The run page lives in the Enrolled repo (ADR-0003).
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Mint the Factory App's token
        # Issues: read/write covers every write below: comments, labels and
        # closing duplicates, all on Tickets in the Home repo. Nothing in this
        # job runs code from a repo or from an agent; it reads the plan as
        # data.
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: trenddreamer
          repositories: ${{ github.event.repository.name == 'ship-it' && 'ship-it' || format('ship-it,{0}', github.event.repository.name) }}
          permission-issues: write

      - name: Take the screenshots from the explore job
        if: needs.explore.result == 'success'
        # A pattern, not a name, so a run with no screenshots finds nothing
        # and carries on.
        uses: actions/download-artifact@v4
        with:
          pattern: explore-evidence
          path: /tmp/evidence
          merge-multiple: true

      - name: Check the plan
        if: needs.explore.result == 'success'
        env:
          # Through env, never pasted into the script. A `${{ }}` inside
          # `run:` is text bash runs, and the plan was written by an agent
          # that has just read a pile of untrusted issues.
          PLAN: ${{ needs.explore.outputs.plan }}
        run: |
          set -euo pipefail
          # Every Ticket in the batch was closed since it was claimed.
          [ "$BATCH" = "[]" ] && exit 0
          printf '%s' "$PLAN" > /tmp/plan.json
          [ -s /tmp/plan.json ] || { echo "The explore run returned no plan." >&2; exit 1; }

          # Every rule, written as "what is wrong". An empty list means apply.
          jq -r --argjson batch "$BATCH" '
            .issues as $plan
            | [
                # Every issue in the batch, exactly once.
                (if ([$plan[].number] | sort) != $batch
                 then "The plan needs exactly one entry for each of \($batch)."
                 else empty end),

                # A tag the branch below knows.
                ($plan[] | select(.tag | IN("easy-call", "needs-a-human", "blocked") | not)
                 | "#\(.number) has a tag this workflow does not know: \(.tag)."),

                # Something to post.
                ($plan[] | select((.comment // "") | test("\\S") | not)
                 | "#\(.number) has an empty comment."),

                # A duplicate points at an issue in this batch that survives.
                ($plan[] | select(.duplicate_of) | . as $dup
                 | select([$plan[] | select(.number == $dup.duplicate_of and (.duplicate_of | not))] == [])
                 | "#\(.number) is a duplicate of #\(.duplicate_of), which is not a surviving issue in this batch.")
              ]
            | .[]
          ' /tmp/plan.json > /tmp/problems.txt

          if [ -s /tmp/problems.txt ]; then
            echo "Refusing the plan. Nothing was written, and the last steps of this job mark the batch agent:blocked." >&2
            cat /tmp/problems.txt >&2
            exit 1
          fi

      - name: Apply the plan
        if: needs.explore.result == 'success' && needs.explore.outputs.batch != '[]'
        # Every label below goes on with the App's token, and that matters
        # for `agent:implement`: a label applied by the built-in token does
        # not fire `issues: labeled`, so agent-implement.yml would never wake
        # up and the chain would end here, silently, with a green tick.
        #
        # The findings comments are NOT tagged `<!-- factory:status -->`.
        # They are the one thing the implementer most needs to read, and it
        # keeps them because the Factory's bot posted them.
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ env.HOME_REPO }}
        run: |
          set -euo pipefail
          # A fresh clone of the Home repo does not have these labels yet.
          gh label create "needs-a-human" --color D93F0B \
            --description "The factory stopped here" || true
          gh label create "agent:implement" --color 5319E7 \
            --description "Hand this issue to the implementer agent" || true

          # nullglob: an issue with no screenshots gets no --attach.
          shopt -s nullglob

          # Survivors first, so "closed as duplicate of #N" points at an issue
          # that already has its findings on it. Duplicates are Tickets in the
          # same batch, so `#N` is a Ticket in the Home repo, where this
          # comment goes.
          for n in $(jq -r '.issues | sort_by([.duplicate_of != null, .number]) | .[].number' /tmp/plan.json); do
            entry="$(jq -c --argjson n "$n" '.issues[] | select(.number == $n)' /tmp/plan.json)"
            dup="$(jq -r '.duplicate_of // empty' <<< "$entry")"
            tag="$(jq -r '.tag' <<< "$entry")"

            if [ -n "$dup" ]; then
              next="Closed as duplicate of #$dup."
            elif [ "$tag" = "easy-call" ]; then
              next="Easy call. Handed to the implementer. Nobody is being asked first."
            else
              next="Stopped at \`$tag\`. Settle the open questions, then label \`agent:implement\` yourself."
            fi

            jq -r '.comment' <<< "$entry" > /tmp/comment.md
            printf '\n\n---\n\n_%s_ [Logs](%s)\n' "$next" "$RUN_URL" >> /tmp/comment.md
            # This issue's screenshots, /tmp/evidence/<n>-*.png. --attach
            # uploads them and swaps each path in the comment for its URL.
            attach=()
            for png in /tmp/evidence/"$n"-*.png; do attach+=(--attach "$png"); done
            gh issue comment "$n" --body-file /tmp/comment.md "${attach[@]}"

            # The branch. Every path takes `agent:in-progress` off: this
            # issue is done, and the steps below leave it alone.
            if [ -n "$dup" ]; then
              gh issue edit "$n" --remove-label "agent:in-progress"
              gh api --method PATCH "repos/$GH_REPO/issues/$n" \
                -f state=closed -f state_reason=duplicate --silent
            elif [ "$tag" = "easy-call" ]; then
              gh issue edit "$n" \
                --remove-label "agent:in-progress" --add-label "agent:implement"
            else
              gh issue edit "$n" \
                --remove-label "agent:in-progress" --add-label "needs-a-human"
            fi
          done

      - name: Mark blocked on failure
        # A step above failed, or the explore job did.
        if: failure() || needs.explore.result != 'success'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ env.HOME_REPO }}
        run: |
          # Only the issues apply did not get to. One it did is already moved on.
          for n in $(jq -r '.[]' <<< "$BATCH"); do
            gh issue view "$n" --json labels --jq '.labels[].name' \
              | grep -qx "agent:in-progress" || continue
            gh issue edit "$n" --add-label "agent:blocked" || true
            gh issue comment "$n" --body \
              "Explore run **failed** — [logs](${RUN_URL}). Re-add \`agent:explore\` to retry. <!-- factory:status -->"
          done

      - name: Always remove in-progress
        # From every Ticket claimed for this run, closed ones included.
        if: always()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ env.HOME_REPO }}
          TICKETS: ${{ inputs.tickets }}
        run: |
          for n in $(jq -r '.[]' <<< "$TICKETS"); do
            gh issue edit "$n" --remove-label "agent:in-progress" || true
          done
