name: Route the Tickets
description: >-
  Routes each Ticket through the Registry (repos.yml) before the Factory works
  on it, and refuses the ones it can't route (ADR-0002).

# What it does, for each Ticket it is given:
#
#   routed    its one `repo:` label is in the Registry. Nothing is written,
#             and its number is in the `routed` output, so the workflow
#             carries on with it.
#   refused   no `repo:` label, more than one, or one the Registry doesn't
#             list. It gets one comment with the reason and a link to the run,
#             loses the label that started the run, and is labelled
#             `agent:blocked`, the way a failed run marks it. Fixing the label
#             and putting the trigger back on is how you retry.
#
# The rule and its tests: .sandcastle/agent-workflows/route/route.ts. This
# action does the I/O around it.
#
# It needs a checkout with repos.yml and .sandcastle/agent-workflows/route in
# it. It installs Node itself: Node runs the routing script as it is, with no
# `npm ci`. `yq`, which reads the Registry, comes with GitHub's Ubuntu images.

inputs:
  tickets:
    description: The issue numbers to route, as a JSON array, e.g. `[12, 13]`.
    required: true
  trigger:
    description: The label that started the run. A refused Ticket loses it.
    required: true
  token:
    description: >-
      A Factory App token with Issues: read/write, to read the Tickets' labels,
      and to comment on and label the refused ones.
    required: true

outputs:
  routed:
    description: The numbers of the Tickets that were routed, as a sorted JSON array.
    value: ${{ steps.route.outputs.routed }}

runs:
  using: composite
  steps:
    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Route each Ticket through the Registry
      id: route
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        TICKETS: ${{ inputs.tickets }}
        TRIGGER: ${{ inputs.trigger }}
        RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        work="$RUNNER_TEMP/route"
        mkdir -p "$work"

        for n in $(jq -r '.[]' <<< "$TICKETS"); do
          gh issue view "$n" --json number,labels
        done | jq -s . > "$work/tickets.json"
        yq -o=json "$GITHUB_WORKSPACE/repos.yml" > "$work/registry.json"
        node "$GITHUB_WORKSPACE/.sandcastle/agent-workflows/route/route-tickets.ts" \
          "$work/registry.json" < "$work/tickets.json" > "$work/routes.json"
        jq -c '.[]' "$work/routes.json"

        refused="$(jq -r '.[] | select(.refusal) | .number' "$work/routes.json")"
        if [ -n "$refused" ]; then
          # A fresh clone of this repository does not have it yet.
          gh label create "agent:blocked" --color B60205 \
            --description "An agent run failed here. Its comment says how to retry" || true
        fi
        for n in $refused; do
          # The reason goes in a file, never through the shell: it quotes the
          # Ticket's labels, and anyone who can label an issue names those.
          {
            printf '**Refused by the Registry.** '
            jq -r --argjson n "$n" '.[] | select(.number == $n) | .refusal' "$work/routes.json"
            printf '\nThe Factory has not started on this Ticket. Fix its `repo:` label, then re-add `%s` to retry. [Logs](%s) <!-- factory:status -->\n' \
              "$TRIGGER" "$RUN_URL"
          } > "$work/reason.md"
          gh issue comment "$n" --body-file "$work/reason.md"
          gh issue edit "$n" --remove-label "$TRIGGER" || true
          gh issue edit "$n" --add-label "agent:blocked"
        done

        echo "routed=$(jq -c '[.[] | select(.repo) | .number] | sort' "$work/routes.json")" \
          >> "$GITHUB_OUTPUT"
